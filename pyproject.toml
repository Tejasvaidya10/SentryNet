[project]
name = "sentrynet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tejas Vaidya", email = "vaidyatejas02@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "imbalanced-learn>=0.14.2",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "python-louvain>=0.16",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "xgboost>=3.2.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]
